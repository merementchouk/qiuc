<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>

  <!-- KaTeX CSS & JS -->
  <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer
src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script
>
  <script defer
src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.
min.js"
          onload="renderMathInElement(document.body, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false}
            ]
          });"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
Helvetica, Arial, sans-serif; line-height: 1.6; max-width: 800px; margin:
40px auto; padding: 0 20px; color: #24292e; }
    nav a { margin-right: 15px; text-decoration: none; font-weight: 600; }
    hr { border: 0; border-top: 1px solid #e1e4e8; margin: 30px 0; }
    .invite-box { background: #f6f8fa; border: 1px solid #d1d5da; padding:
15px; border-radius: 6px; margin: 20px 0; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/past-meetings.html' | relative_url }}">Past Meetings</a>
  </nav>
  <hr>
  {{ content }}
</body>
</html>
